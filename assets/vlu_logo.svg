    <!-- Top Bar with Dip -->
    <path d="M 10 8 C 35 2, 85 2, 110 8 L 110 20 C 85 14, 35 14, 10 20 Z"/>
    
    <!-- Lower Shield Body -->
    <path d="M 10 26 H 110 V 78 C 110 118 60 148 60 148 C 60 148 10 118 10 78 Z"/>
  </g>
  
  <!-- Stylized Winged V Emblem -->
